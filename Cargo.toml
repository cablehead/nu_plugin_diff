[package]
name = "nu_plugin_diff"
version = "0.1.0"
edition = "2021"
description = "Holds diffs on the server and projects them into a page as plain HTML"

[dependencies]
nu-plugin = "0.117.0"
nu-protocol = { version = "0.117.0", features = ["plugin"] }
serde = { version = "1", features = ["derive"] }
typetag = "0.2"
similar = "2"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "parsing", "html", "regex-fancy", "yaml-load"] }

[profile.release]
opt-level = 3
